<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:,">
    <script src="main.js" type="module"></script>
    <title>Unit Converter</title>
</head>
<body>
    <div class="main">
        <nav class="tab-buttons">
            <div class="tab-button length-tab-btn tab-btn-default">Length</div>
            <div class="tab-button weight-tab-btn">Weight</div>
            <div class="tab-button temperature-tab-btn">Temperature</div>
        </nav>
        <div class="tabs">
            <div class="tab length-tab tab-default">
                <form data-category="length">
                    <div class="form-field">
                        <label for="current-value">Convert this value</label>
                        <input type="number" name="current-value" id="current-value" required>
                    </div>
                    <div class="form-select">
                        <div class="form-select-unit">
                            <label for="current-unit">From</label>
                            <select name="current-unit" id="current-unit">
                                <option value="mm">millimeter (mm)</option>
                                <option value="cm">centimeter (cm)</option>
                                <option value="inch">inch (in)</option>
                                <option value="foot">foot (ft)</option>
                                <option value="yard">yard (yd)</option>
                                <option value="m">meter (m)</option>
                                <option value="km">kilometer (km)</option>
                                <option value="mile">mile (mi)</option>
                            </select>
                        </div>
                        <div class="form-select-unit">
                            <label for="target-unit">To</label>
                            <select name="target-unit" id="target-unit">
                                <option value="mm">millimeter (mm)</option>
                                <option value="cm">centimeter (cm)</option>
                                <option value="inch">inch (in)</option>
                                <option value="foot">foot (ft)</option>
                                <option value="yard">yard (yd)</option>
                                <option value="m">meter (m)</option>
                                <option value="km">kilometer (km)</option>
                                <option value="mile">mile (mi)</option>                        
                            </select>
                        </div>
                    </div>
                    <div class="form-result">
                        <label for="result">Result</label>
                        <span></span>
                    </div>
                    <div class="form-submit-btn">
                        <button type="submit" class="form-submit-btn">Convert</button>
                    </div>
                </form>
            </div>
            <div class="tab weight-tab">
                <form data-category="weight">
                    <div class="form-field">
                        <label for="current-value">Convert this value</label>
                        <input type="number" name="current-value" id="current-value" required>
                    </div>
                    <div class="form-select">
                        <div class="form-select-unit">
                            <label for="current-unit">From</label>
                            <select name="current-unit" id="current-unit">
                                <option value="mg">milligram (mg)</option>
                                <option value="g">gram (g)</option>
                                <option value="oz">ounce (oz)</option>
                                <option value="lb">pound (lb)</option>
                                <option value="kg">kilogram (kg)</option>
                            </select>
                        </div>
                        <div class="form-select-unit">
                            <label for="target-unit">To</label>
                            <select name="target-unit" id="target-unit">
                                <option value="mg">milligram (mg)</option>
                                <option value="g">gram (g)</option>
                                <option value="oz">ounce (oz)</option>
                                <option value="lb">pound (lb)</option>
                                <option value="kg">kilogram (kg)</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-result">
                        <label for="result">Result</label>
                        <span></span>
                    </div>
                    <div class="form-submit-btn">
                        <button type="submit" class="form-submit-btn">Convert</button>
                    </div>
                </form>
            </div>
            <div class="tab temperature-tab">
                <form data-category="temperature">
                    <div class="form-field">
                        <label for="current-value">Convert this value</label>
                        <input type="number" name="current-value" id="current-value" required>
                    </div>
                    <div class="form-select">
                        <div class="form-select-unit">
                            <label for="current-unit">From</label>
                            <select name="current-unit" id="current-unit">
                                <option value="K">kelvin (k)</option>
                                <option value="F">fahrenheit (°F)</option>
                                <option value="C">celcius (°C)</option>
                            </select>
                        </div>
                        <div class="form-select-unit">
                            <label for="target-unit">To</label>
                            <select name="target-unit" id="target-unit">
                                <option value="K">kelvin (k)</option>
                                <option value="F">fahrenheit (°F)</option>
                                <option value="C">celcius (°C)</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-result">
                        <label for="result">Result</label>
                        <span></span>
                    </div>
                    <div class="form-submit-btn">
                        <button type="submit" class="form-submit-btn">Convert</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
